# webstream — exemple de compose de déploiement (NAS). Le proxy (NPMplus) renvoie
# https://ws.karkadann.ovh vers ce conteneur, avec SON certificat.
services:
  webstream:
    image: karkadamn/webstream:latest
    container_name: webstream
    restart: unless-stopped
    ports:
      - "8095:80"                     # accès : http://IP_NAS:8095 (derrière le proxy)
    environment:
      # Où la page cherche l'app sur le réseau du navigateur (virgules). 3.3.3.1 = l'adresse
      # de service de screen-stream sur son hotspot.
      WEBSTREAM_ADDRS: "3.3.3.1"
      # Port WebRTC de l'app (UDP et TCP) — ne change qu'avec screen-stream.
      WEBSTREAM_PORT: "3333"
      # Facultatif : empreintes d'AUTRES identités que l'identité commune de l'app (déjà dans la page).
      WEBSTREAM_FINGERPRINTS: ""
