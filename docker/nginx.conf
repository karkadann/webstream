# Seuls les fichiers de la page sont servis ; tout le reste répond 404.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # no-cache : le navigateur revalide à chaque chargement ; le service worker de la page garde
    # sa copie pour le chargement sans internet.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /            { try_files /index.html =404; }
    location = /index.html  { }
    location = /config.js   { default_type text/javascript; }
    location = /sw.js       { default_type text/javascript; }
    location = /favicon.svg { }
    location = /favicon.ico { try_files /favicon.svg =404; }
    location /              { return 404; }
}
