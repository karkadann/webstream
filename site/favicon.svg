<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Icône de l'onglet : un écran qui diffuse. Volontairement lisible à 16 px — pas de détail
       en dessous de 4 px de large, sinon il ne reste qu'une tache à la taille où on la regarde. -->
  <rect width="64" height="64" rx="12" fill="#0b0f1a"/>
  <rect x="12" y="16" width="40" height="26" rx="3" fill="none" stroke="#5b8cff" stroke-width="4"/>
  <path d="M26 48h12" stroke="#5b8cff" stroke-width="4" stroke-linecap="round"/>
  <!-- Les deux arcs de diffusion, côté droit de l'écran. -->
  <path d="M38 24a8 8 0 0 1 0 10" fill="none" stroke="#7ee0a1" stroke-width="3" stroke-linecap="round"/>
  <path d="M43 20a15 15 0 0 1 0 18" fill="none" stroke="#7ee0a1" stroke-width="3" stroke-linecap="round"/>
</svg>
