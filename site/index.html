<!doctype html>
<!--
  Webstream — la page hébergée de screen-stream (servie par un proxy, avec SON certificat).

  Elle ne contient pas le stream : elle cherche l'app sur le réseau local, s'y relie par WebRTC, puis
  charge la page de l'app (assets/web/index.html de l'APK) par ce lien et lui cède le document. Page
  et protocole restent donc ceux de l'APK installé ; ce fichier ne change qu'avec le transport.

  Le lien : un data channel WebRTC SANS signalisation (cf. webstream/webstream.go). La page fabrique
  la réponse SDP de l'app — adresse, port, empreinte de son certificat, identifiants ICE — et choisit
  elle-même l'identifiant ICE de l'app (un par connexion), auquel l'app reconnaît un client neuf. Le
  chiffrement est authentifié par l'EMPREINTE du certificat de l'app, pas par une autorité : aucun
  certificat ni jeton n'est nécessaire dans l'app pour ce chemin. Depuis la 7.16.01, toutes les
  installations partagent le même certificat (webstream/identity.go), dont l'empreinte est écrite ici
  (SHARED_FP) : rien à configurer.

  Réglages : config.js (adresses, port, empreintes d'autres apps, facultatives). Dans l'URL :
    ?a=ip[,ip]    remplace les adresses (essais à l'atelier).
  Les autres paramètres (?diag=1, ?d=broadway) sont lus par la page de l'app.

  Pas de stream : rien d'autre qu'une ligne discrète, et un nouvel essai toutes les 3 s.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Screen Stream</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #8a93ad;
      font-family: system-ui, sans-serif; overflow: hidden; }
    #msg { position: fixed; bottom: 12px; left: 0; right: 0; text-align: center; font-size: 13px; }
  </style>
</head>
<body>
  <div id="msg"></div>
  <script src="config.js"></script>
  <script>
  (() => {
    'use strict';

    // ---- Réglages ---------------------------------------------------------------------------------
    const CFG = Object.assign({ addrs: ['3.3.3.1'], port: 3333, fingerprints: [] }, window.WEBSTREAM_CONFIG || {});
    // Le mot de passe ICE de l'app (webstream.go, IcePwd) : il n'a rien de secret.
    const ICE_PWD = 'ScreenStreamWebstreamIce1';
    const TRY_MS = 4000;          // un essai (adresse, empreinte) sans réponse est abandonné
    const RETRY_MS = 3000;        // entre deux tours sans stream
    const FP_RE = /^([0-9A-F]{2}:){31}[0-9A-F]{2}$/;
    // L'empreinte de l'identité COMMUNE de l'app (webstream/identity.go, SharedFingerprint).
    const SHARED_FP = '7D:F9:E4:F2:6B:B0:AB:62:32:30:46:29:FC:BB:E8:F1:E9:BD:8F:D2:E8:B2:9C:81:E3:23:BE:65:D9:89:40:EA';

    const msgEl = document.getElementById('msg');
    const say = (t) => { msgEl.textContent = t; };

    const params = new URLSearchParams(location.search);
    const addrs = (params.get('a') || '').split(',').map((s) => s.trim()).filter(Boolean);
    if (!addrs.length) addrs.push(...CFG.addrs);

    // ---- Empreintes de l'app : la commune d'abord, puis celles de config.js (facultatives) ----------
    function fingerprints() {
      const all = [SHARED_FP, ...(CFG.fingerprints || []).map((f) => String(f).toUpperCase())];
      return all.filter((f, i) => FP_RE.test(f) && all.indexOf(f) === i);
    }

    // ---- Le certificat DTLS de CE navigateur, gardé : l'app l'apparie par son empreinte -----------
    function idb() {
      return new Promise((ok, ko) => {
        const r = indexedDB.open('webstream', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => ok(r.result);
        r.onerror = () => ko(r.error);
      });
    }
    async function browserCert() {
      const fresh = (c) => c && c.expires > Date.now() + 86400e3;
      let db = null;
      try {
        db = await idb();
        const kept = await new Promise((ok) => {
          const r = db.transaction('kv').objectStore('kv').get('dtls');
          r.onsuccess = () => ok(r.result);
          r.onerror = () => ok(null);
        });
        if (fresh(kept)) return kept;
      } catch (e) {}
      const cert = await RTCPeerConnection.generateCertificate(
        { name: 'ECDSA', namedCurve: 'P-256', expires: 365 * 86400e3 });
      try { if (db) db.transaction('kv', 'readwrite').objectStore('kv').put(cert, 'dtls'); } catch (e) {}
      return cert;
    }

    // ---- Une connexion à l'app -----------------------------------------------------------------------
    const rand = (n) => {
      const a = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      return Array.from(crypto.getRandomValues(new Uint8Array(n)), (b) => a[b % a.length]).join('');
    };

    /** La réponse SDP de l'app, fabriquée ici : l'app est ICE-lite, serveur DTLS, sur [addr]:[port]. */
    function answerFor(offerSdp, addr, fp) {
      const mid = (/^a=mid:(\S+)/m.exec(offerSdp) || [])[1] || '0';
      return [
        'v=0',
        'o=- ' + Date.now() + ' 2 IN IP4 127.0.0.1',
        's=-',
        't=0 0',
        'a=group:BUNDLE ' + mid,
        'a=ice-lite',
        'm=application 9 UDP/DTLS/SCTP webrtc-datachannel',
        'c=IN IP4 0.0.0.0',
        'a=mid:' + mid,
        'a=ice-ufrag:' + rand(16),          // l'identifiant de l'app POUR CETTE connexion
        'a=ice-pwd:' + ICE_PWD,
        'a=fingerprint:sha-256 ' + fp,
        'a=setup:passive',
        'a=sctp-port:5000',
        'a=max-message-size:65536',
        'a=candidate:1 1 udp 2130706431 ' + addr + ' ' + CFG.port + ' typ host',
        'a=candidate:2 1 tcp 1518280447 ' + addr + ' ' + CFG.port + ' typ host tcptype passive',
        'a=end-of-candidates',
        '',
      ].join('\r\n');
    }

    /**
     * Le lien avec l'app : un PeerConnection, sa voie `asset` (fichiers de la page), et des voies
     * ouvertes à la demande ([open]) qui se comportent comme des WebSocket pour la page de l'app.
     * Perdu, il se rétablit au prochain [open] (même adresse et empreinte d'abord).
     */
    class Link {
      constructor(cert) {
        this.cert = cert;
        this.pc = null;
        this.addr = null;
        this.fp = null;
        this.assets = null;       // Sock de la voie `asset`
        this.reviving = null;     // rétablissement en cours (une seule promesse)
        this.suspect = false;     // la page a abandonné une voie : la connexion est peut-être morte
        this.assetQueue = Promise.resolve();
        this.workerUrlPromise = null;
      }

      get alive() { return !!this.pc && this.pc.connectionState === 'connected'; }

      /** Essaie [addr] avec l'empreinte [fp] ; rend vrai si la voie `asset` s'ouvre. */
      async attempt(addr, fp) {
        const pc = new RTCPeerConnection({ certificates: [this.cert], iceServers: [] });
        const dc = pc.createDataChannel('asset');
        const ok = await new Promise((resolve) => {
          let done = false;
          const end = (v) => { if (!done) { done = true; clearTimeout(timer); resolve(v); } };
          const timer = setTimeout(() => end(false), TRY_MS);
          dc.onopen = () => end(true);
          pc.onconnectionstatechange = () => {
            if (pc.connectionState === 'failed' || pc.connectionState === 'closed') end(false);
          };
          (async () => {
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            await pc.setRemoteDescription({ type: 'answer', sdp: answerFor(offer.sdp, addr, fp) });
          })().catch(() => end(false));
        });
        if (!ok) { try { pc.close(); } catch (e) {} return false; }
        this.pc = pc;
        this.addr = addr;
        this.fp = fp;
        this.assets = new Sock(this, 'asset', dc);
        this.assets.binaryType = 'arraybuffer';
        this.assetQueue = Promise.resolve();
        return true;
      }

      /** Un tour de tous les couples (adresse, empreinte), le dernier qui a marché d'abord. */
      async connect() {
        const fps = fingerprints();
        const pairs = [];
        if (this.addr && this.fp) pairs.push([this.addr, this.fp]);
        for (const fp of fps) for (const a of addrs) pairs.push([a, fp]);
        for (const [a, fp] of pairs) {
          if (await this.attempt(a, fp)) return true;
        }
        return false;
      }

      /**
       * Rétablit le lien s'il est perdu ; une seule tentative à la fois. ⚠️ Une connexion dont l'app a
       * disparu sans la fermer (redémarrage, plantage) reste `connected` ~30 s aux yeux du navigateur :
       * la page qui abandonne une voie muette ([suspect], cf. Sock.close) la fait refaire aussitôt.
       */
      revive() {
        if (this.alive && !this.suspect) return Promise.resolve(true);
        if (!this.reviving) {
          this.suspect = false;
          if (this.pc) { try { this.pc.close(); } catch (e) {} this.pc = null; }
          this.reviving = this.connect().finally(() => { this.reviving = null; });
        }
        return this.reviving;
      }

      /** Une voie neuve [label] (`ws`, `audio`), présentée comme un WebSocket. */
      open(label) { return new Sock(this, label, null); }

      /** Le fichier [path] de la page de l'app (assets/web/…), en ArrayBuffer. */
      asset(path) {
        const run = () => new Promise(async (ok, ko) => {
          if (!this.alive && !(await this.revive())) { ko(new Error('no link')); return; }
          const s = this.assets;
          const timer = setTimeout(() => { s.onmessage = null; ko(new Error('timeout: ' + path)); }, 15000);
          s.onmessage = (m) => {
            clearTimeout(timer);
            s.onmessage = null;
            if (typeof m.data === 'string') ko(new Error(m.data)); else ok(m.data);
          };
          try { s.send('GET ' + path); } catch (e) { clearTimeout(timer); ko(e); }
        });
        const p = this.assetQueue.then(run, run);
        this.assetQueue = p.catch(() => {});
        return p;
      }

      /**
       * Le worker de Broadway (décodage logiciel, repli de WebCodecs), bâti en un seul script : ses
       * importScripts relatifs et le chargement de avc.wasm visaient l'app, pas ce site.
       */
      workerUrl() {
        if (!this.workerUrlPromise) {
          const text = (b) => new TextDecoder().decode(b);
          this.workerUrlPromise = (async () => {
            const [dec, yuv, wrk, wasm] = [
              await this.asset('broadway/Decoder.js'), await this.asset('broadway/YUVCanvas.js'),
              await this.asset('broadway/h264-worker.js'), await this.asset('broadway/avc.wasm')];
            let bin = '';
            const u = new Uint8Array(wasm);
            for (let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
            // avc.wasm : demandé par fetch() à une adresse relative, qu'un worker en mémoire ne résout
            // pas — servi ici depuis les octets reçus.
            const src = 'var __wasm=(function(s){var b=atob(s),u=new Uint8Array(b.length);' +
              'for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;})("' + btoa(bin) + '");\n' +
              '(function(){var f=self.fetch;self.fetch=function(u){return /avc\\.wasm$/.test(String(u&&u.url||u))?' +
              'Promise.resolve(new Response(__wasm,{headers:{"Content-Type":"application/wasm"}})):' +
              'f.apply(self,arguments);};})();\n' +
              text(dec) + '\n' + text(yuv) + '\n' + text(wrk).replace(/^\s*importScripts\([^)]*\);?[ \t]*$/m, '');
            return URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
          })();
          this.workerUrlPromise.catch(() => { this.workerUrlPromise = null; });
        }
        return this.workerUrlPromise;
      }
    }

    /**
     * Une voie présentée comme un WebSocket (readyState, binaryType, on*, send, close,
     * bufferedAmount) : la page de l'app n'a qu'à remplacer `new WebSocket(url)`.
     * Messages binaires : un octet de tête (0 entier, 1 morceau, 2 dernier morceau) que l'on retire
     * en recollant (cf. webstream.go, Send).
     */
    class Sock {
      constructor(link, label, dc) {
        this.readyState = 0;
        this.binaryType = 'blob';
        this.onopen = this.onclose = this.onerror = this.onmessage = null;
        this.label = label;
        this.link = link;
        this.dc = null;
        this.parts = [];
        if (dc) { this.attach(dc); return; }
        link.revive().then((up) => {
          if (this.readyState === 3) return;
          if (!up) { this.closed(1006, 'no stream'); return; }
          // ⛔ Le son SANS ORDRE GARANTI : la bibliothèque de l'app (pion) envoie ces messages avant
          // ceux qui attendent en file. Ordonné, un bloc de son attendait derrière les images en
          // file (une image clé : des centaines de Ko) — recalages et coupes en rafale (7.16.00).
          const opts = label === 'audio' ? { ordered: false } : {};
          try { this.attach(link.pc.createDataChannel(label, opts)); } catch (e) { this.closed(1006, String(e)); }
        });
      }

      attach(dc) {
        this.dc = dc;
        dc.binaryType = 'arraybuffer';
        if (this.readyState === 3) { try { dc.close(); } catch (e) {} return; }
        const opened = () => {
          if (this.readyState !== 0) return;
          this.readyState = 1;
          if (this.onopen) this.onopen({ type: 'open' });
        };
        dc.onopen = opened;
        dc.onclose = () => this.closed(1006, 'channel closed');
        dc.onerror = (e) => { if (this.onerror) this.onerror(e); };
        dc.onmessage = (ev) => this.receive(ev.data);
        // Déjà ouverte (la voie `asset`, ouverte par l'essai) : utilisable tout de suite.
        if (dc.readyState === 'open') {
          this.readyState = 1;
          setTimeout(() => { if (this.onopen) this.onopen({ type: 'open' }); }, 0);
        }
      }

      receive(data) {
        if (typeof data === 'string') { this.emit(data); return; }
        const b = new Uint8Array(data);
        if (b.length === 0) return;
        if (b[0] === 0) { this.emit(data.slice(1)); return; }
        this.parts.push(b.subarray(1));
        if (b[0] !== 2) return;
        let n = 0;
        for (const p of this.parts) n += p.length;
        const all = new Uint8Array(n);
        let off = 0;
        for (const p of this.parts) { all.set(p, off); off += p.length; }
        this.parts = [];
        this.emit(all.buffer);
      }

      emit(payload) {
        if (this.readyState !== 1 || !this.onmessage) return;
        const data = (typeof payload !== 'string' && this.binaryType === 'blob') ? new Blob([payload]) : payload;
        this.onmessage({ data });
      }

      get bufferedAmount() { return this.dc ? this.dc.bufferedAmount : 0; }

      send(x) {
        if (this.readyState !== 1) throw new DOMException('not open', 'InvalidStateError');
        this.dc.send(x);
      }

      close() {
        if (this.readyState >= 2) return;
        // La page ne ferme une voie qu'en panne (lien muet, erreur) : la connexion est suspecte.
        if (this.label !== 'asset') this.link.suspect = true;
        this.readyState = 2;
        if (this.dc) { try { this.dc.close(); } catch (e) {} }
        this.closed(1000, '');
      }

      /** Comme un WebSocket : `onclose` une fois, jamais pendant l'appel qui ferme. */
      closed(code, reason) {
        if (this.readyState === 3) return;
        this.readyState = 3;
        setTimeout(() => { if (this.onclose) this.onclose({ type: 'close', code, reason, wasClean: code === 1000 }); }, 0);
      }
    }
    Sock.CONNECTING = 0; Sock.OPEN = 1; Sock.CLOSING = 2; Sock.CLOSED = 3;

    // ---- Démarrage -----------------------------------------------------------------------------------
    async function main() {
      if (typeof RTCPeerConnection !== 'function') { say('This browser has no WebRTC.'); return; }
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
      const link = new Link(await browserCert());
      for (;;) {
        if (await link.connect()) break;
        say('No stream');
        await new Promise((r) => setTimeout(r, RETRY_MS));
      }
      say('');
      let html;
      try { html = new TextDecoder().decode(await link.asset('index.html')); }
      catch (e) { say('Stream found, page not loaded: ' + e.message); setTimeout(() => location.reload(), RETRY_MS); return; }
      // La page de l'app prend le document ; elle trouve le lien ici (cf. son `HOSTED`).
      window.WEBSTREAM = link;
      document.open();
      document.write(html);
      document.close();
    }
    main().catch((e) => say('Error: ' + (e && e.message)));
  })();
  </script>
</body>
</html>
