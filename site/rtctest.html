<!doctype html>
<!--
  Page de diagnostic (hors stream) : qu'est-ce qui fait croire a la Tesla qu'une page est une « video »
  et affiche le bandeau « Video bridee au son uniquement » ? On isole, du plus simple au complet :

    ?case=none       un canvas anime, AUCUN WebRTC, aucun decodage   (temoin : ne doit PAS declencher)
    ?case=pc         new RTCPeerConnection + un data channel, rien de plus
    ?case=offer      + createOffer + setLocalDescription             (collecte ICE, jamais connecte)
    ?case=loopback   deux RTCPeerConnection relies EN BOUCLE, data channel ouvert, donnees en continu
    ?case=decoder    un VideoDecoder WebCodecs qui decode un petit clip H.264 en boucle, SANS WebRTC
                     (temoin : l'ancien chemin WebSocket decodait deja en materiel sans bandeau)
    ?case=rtcdecoder loopback WebRTC + VideoDecoder en meme temps   (le cas DECISIF : la combinaison)

  A tester en PARKING : ouvrir chaque cas, noter si le bandeau apparait. Le canvas est anime partout
  (l'animation seule est hors de cause, le stream WebSocket animait deja un canvas sans bandeau).
-->
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RTC test</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    body { display: flex; flex-direction: column; background: #111; color: #eee; }
    #bar { padding: 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    a.btn { padding: 8px 12px; border-radius: 8px; background: #2563eb; color: #fff;
      text-decoration: none; font-size: 15px; }
    a.btn.on { background: #16a34a; }
    #case { font-weight: 700; margin-left: 4px; }
    #cv { flex: 1; width: 100%; display: block; background: #000; }
    #log { max-height: 30vh; overflow: auto; padding: 6px 10px; font: 12px/1.4 monospace;
      white-space: pre-wrap; background: #000; }
  </style>
</head>
<body>
  <div id="bar">
    <a class="btn" href="?case=none">none</a>
    <a class="btn" href="?case=pc">pc</a>
    <a class="btn" href="?case=offer">offer</a>
    <a class="btn" href="?case=loopback">loopback</a>
    <a class="btn" href="?case=decoder">decoder</a>
    <a class="btn" href="?case=rtcdecoder">rtcdecoder</a>
    <span id="case"></span>
  </div>
  <canvas id="cv"></canvas>
  <div id="log"></div>
  <script>
  (() => {
    'use strict';
    const kase = new URLSearchParams(location.search).get('case') || 'none';
    const logEl = document.getElementById('log');
    const log = (m) => { logEl.textContent += m + '\n'; logEl.scrollTop = logEl.scrollHeight; };
    document.getElementById('case').textContent = 'case = ' + kase;
    for (const a of document.querySelectorAll('a.btn'))
      if (a.getAttribute('href') === '?case=' + kase) a.classList.add('on');

    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    function resize() { cv.width = cv.clientWidth; cv.height = cv.clientHeight; }
    resize(); addEventListener('resize', resize);
    // Canvas anime (temoin). Les cas qui decodent dessinent par-dessus.
    let t = 0, decodedFrames = 0;
    (function draw() {
      t += 2;
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = '#2563eb';
      ctx.fillRect((t % Math.max(1, cv.width - 80)), cv.height - 90, 80, 20);
      ctx.fillStyle = '#eee'; ctx.font = '20px system-ui';
      ctx.fillText(kase + '  frames=' + decodedFrames, 16, 32);
      requestAnimationFrame(draw);
    })();

    log('case: ' + kase);
    log('RTCPeerConnection: ' + (typeof RTCPeerConnection) + '  VideoDecoder: ' + (typeof VideoDecoder));

    // --- Loopback WebRTC : deux pairs relies dans la meme page ---
    function startLoopback() {
      const a = new RTCPeerConnection({ iceServers: [] });
      const b = new RTCPeerConnection({ iceServers: [] });
      a.onicecandidate = (e) => e.candidate && b.addIceCandidate(e.candidate);
      b.onicecandidate = (e) => e.candidate && a.addIceCandidate(e.candidate);
      a.onconnectionstatechange = () => log('rtc a: ' + a.connectionState);
      const dc = a.createDataChannel('ws');
      dc.onopen = () => { log('data channel OUVERT'); setInterval(() => { try { dc.send('x'.repeat(1000)); } catch (e) {} }, 40); };
      b.ondatachannel = (e) => { e.channel.onmessage = () => {}; };
      a.createOffer().then((o) => a.setLocalDescription(o).then(() => b.setRemoteDescription(o)))
        .then(() => b.createAnswer()).then((ans) => b.setLocalDescription(ans).then(() => a.setRemoteDescription(ans)))
        .then(() => log('offre/reponse echangees en boucle.')).catch((e) => log('loopback err: ' + e));
    }

    function clipBytes() {
      const bin = atob(CLIP_B64), u = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      return u;
    }
    // Decoupe le flux Annex-B en unites d'acces, sur les delimiteurs (NAL type 9).
    function accessUnits(buf) {
      const starts = [];
      for (let i = 0; i + 3 < buf.length; i++) {
        if (buf[i] === 0 && buf[i + 1] === 0 &&
            (buf[i + 2] === 1 || (buf[i + 2] === 0 && buf[i + 3] === 1))) {
          const sc = buf[i + 2] === 1 ? 3 : 4;
          const type = buf[i + sc] & 0x1f;
          starts.push({ pos: i, type });
          i += sc;
        }
      }
      const aud = starts.filter((s) => s.type === 9).map((s) => s.pos);
      const units = [];
      for (let k = 0; k < aud.length; k++)
        units.push(buf.subarray(aud[k], k + 1 < aud.length ? aud[k + 1] : buf.length));
      return units;
    }
    function startDecoder() {
      if (typeof VideoDecoder !== 'function') { log('VideoDecoder absent (pas de secure context ?)'); return; }
      const units = accessUnits(clipBytes());
      log('clip: ' + units.length + ' images');
      const dec = new VideoDecoder({
        output: (frame) => { try { ctx.drawImage(frame, 0, 0, cv.width, cv.height); } catch (e) {} decodedFrames++; frame.close(); },
        error: (e) => log('decoder error: ' + e),
      });
      dec.configure({ codec: 'avc1.42C00A' });   // baseline, lu du SPS du clip
      log('decoder configure: ' + dec.state);
      let ts = 0, i = 0;
      setInterval(() => {
        if (dec.state !== 'configured') return;
        const au = units[i % units.length]; i++;
        try { dec.decode(new EncodedVideoChunk({ type: 'key', timestamp: ts, data: au })); } catch (e) { log('decode err: ' + e); }
        ts += 100000;   // 10 i/s
      }, 100);
    }

    try {
      if (kase === 'none') { log('aucun WebRTC, aucun decodage.'); return; }
      if (kase === 'pc') {
        const pc = new RTCPeerConnection({ iceServers: [] });
        pc.createDataChannel('ws');
        log('RTCPeerConnection cree + data channel, aucune connexion.');
        return;
      }
      if (kase === 'offer') {
        const pc = new RTCPeerConnection({ iceServers: [] });
        pc.createDataChannel('ws');
        pc.onicegatheringstatechange = () => log('ice gathering: ' + pc.iceGatheringState);
        pc.createOffer().then((o) => pc.setLocalDescription(o))
          .then(() => log('offre posee, jamais connecte.')).catch((e) => log('offer err: ' + e));
        return;
      }
      if (kase === 'loopback') { startLoopback(); return; }
      if (kase === 'decoder') { startDecoder(); return; }
      if (kase === 'rtcdecoder') { startLoopback(); startDecoder(); return; }
    } catch (e) { log('ERREUR: ' + e); }
  })();
  </script>
</body>
